name: Feature request
description: 提出一个新能力、技能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你正在做什么，哪里卡住了？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你想象中它应该怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你尝试过其他什么办法？
  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - 平台能力（代码）
        - 技能 / 工作流 / 知识（Markdown）
        - Agent 定义
        - 其他
    validations:
      required: true
