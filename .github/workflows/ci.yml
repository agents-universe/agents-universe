name: CI

on:
  push:
  pull_request:

jobs:
  agent-core:
    name: agent-core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd packages/agent-core
          pip install -e ".[test]"
      - name: Test
        run: |
          cd packages/agent-core
          pytest

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "packages/agent-core[test]"
          cd packages/api
          pip install -e ".[test]"
      - name: Test
        run: |
          cd packages/api
          pytest

  api-postgres:
    name: api (pytest, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentsuniverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentsuniverse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest setdefaults TEST_DATABASE_URL, so this URL wins; the conftest
      # alembic fixture then runs the full migration chain against Postgres.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentsuniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "packages/agent-core[test]"
          cd packages/api
          pip install -e ".[test,postgres]"
      - name: Test
        run: |
          cd packages/api
          pytest

  web:
    name: web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: packages/web
      - name: Test
        run: npm test -- --run
        working-directory: packages/web
