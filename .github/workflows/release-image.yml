name: Release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  # Never cancel a release mid-push: a half-pushed tag is worse than a queued one.
  cancel-in-progress: false

jobs:
  build-push:
    name: build + push chas3/agents-universe
    runs-on: ubuntu-latest
    steps:
      # v* also matches junk like v-test; without this guard those tags burn
      # a full build and push garbage. Prereleases (v0.0.0-test.1) are allowed.
      - name: Tag guard (semver release tag)
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "not a release tag: $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.7.0 from the tag name, 1.7.0 with the leading v stripped.
      # flavor latest=true additionally moves :latest on every release tag
      # (explicit, not relying on auto semantics).
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: chas3/agents-universe
          flavor: |
            latest=true
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted runners must not use the Dockerfile's China-mirror
          # defaults (npmmirror / Tsinghua) - same official-source set as README.
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_TRUSTED_HOST=pypi.org
            APT_MIRROR_HOST=deb.debian.org
            NODE_BASE_URL=https://nodejs.org/dist
            PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.playwright.dev
          # mode=max exports the intermediate web-build / python-deps stages
          # too (Playwright + pentest toolchain), so releases after the first
          # are cheap. Caveats: the repo's 10GB GHA cache quota may LRU-evict
          # under this multi-GB image, and RUN --mount=type=cache stores are
          # builder-local (never exported) - layer cache still skips those
          # steps whenever their inputs are unchanged.
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
