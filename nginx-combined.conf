# Combined image: nginx is the single public entry point (port 8000). It serves
# the built web UI and proxies API traffic to uvicorn on 127.0.0.1:8001 so the
# browser uses a single origin.
server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached: it references hashed assets, so a
    # stale copy makes browsers load deleted JS/CSS after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets (vite emits index-<hash>.js/css): safe to cache
    # forever — a new deploy changes the hash, never the file content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth login/callback (cookie must land on the web origin)
    location /auth/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
    }

    # WebSocket connections (conversation streaming, script runs)
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Casdoor proxy: the browser and the API both use http://localhost:8003.
# From inside this container, localhost:8003 lands here and is forwarded to
# the Casdoor container via host.docker.internal (which resolves differently
# host-side vs container-side). Casdoor's `origin` is set to localhost:8003,
# so the OIDC discovery doc advertises localhost URLs for both parties.
server {
    listen 8003;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
