[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.1.0"
description = "Agents Universe — LLM orchestration engine"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # LLM providers
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-genai>=2.0.0",
    # HTTP
    "httpx>=0.27.0",
    # MCP client (Model Context Protocol)
    "mcp>=2.0.0",
    # Browser automation
    "playwright>=1.46.0",
    # Image processing
    "Pillow>=10.4.0",
    # Config / parsing
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.0",
    # DB (tools/_auth.py reads tokens via context.db_session)
    "sqlalchemy>=2.0.0",
    # Data analysis (code_executor / shell run user analyses in this env)
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pyarrow>=17.0.0",
    # Utils
    "tenacity>=8.5.0",
    # Repo code graphs (tree-sitter grammars bundled; loaded lazily on build)
    "tree-sitter-language-pack>=1.14,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "vcrpy>=6.0.0",
    "pytest-mock>=3.14.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
