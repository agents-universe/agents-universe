[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-universe-api"
version = "0.1.0"
description = "Agents Universe — FastAPI web service"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # DB
    "sqlalchemy[asyncio]>=2.0.0",
    "aioodbc>=0.5.0",
    "pyodbc>=5.1.0",
    "alembic>=1.13.0",
    # Auth
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    # Encryption
    "cryptography>=43.0.0",
    # Config
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Redis (L2 session memory)
    "redis>=5.0.0",
    # Utils
    "python-frontmatter>=1.1.0",
    "aiofiles>=24.1.0",
    # Image metadata (dimensions for uploaded attachments)
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pytest-mock>=3.14.0",
    # Async drivers: the offline migration-compile test renders every dialect
    # (env.py builds an async engine at import time, even offline).
    # Sync drivers: conftest runs the real migration chain on the CI PostgreSQL
    # job, and env.py maps each async URL to its sync alembic counterpart.
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
]
# Async app drivers (runtime); their sync alembic counterparts live in [test].
postgres = [
    "asyncpg>=0.29.0",
]
mysql = [
    "aiomysql>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
