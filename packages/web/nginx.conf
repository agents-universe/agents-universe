server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached: it references hashed assets, so a
    # stale copy makes browsers load deleted JS/CSS after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets: cache forever, and NEVER fall back to the SPA
    # index.html. A missing asset must return 404 — returning index.html
    # makes dynamic import() fail with "Failed to fetch dynamically imported
    # module". Matches the app under base paths /, /agent/ and /agent-web/
    # (see VITE_BASE_PATH).
    location ~ ^/(?:assets|agent/assets|agent-web/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /heartbeat {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
